name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: coffee-recipe-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            coffee-recipe-app/requirements.txt
            coffee-recipe-app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q dialed_in tests

      - name: Check JavaScript syntax
        run: find dialed_in/static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=dialed_in \
            --cov-report=term-missing \
            --cov-report=xml
