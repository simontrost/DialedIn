<dialog id="dialInLogDialog">
  <form id="dialInLogForm">
    <div class="dialog-header">
      <div>
        <p class="eyebrow" id="dialInLogEyebrow">Brew measurement</p>
        <h2 id="dialInLogTitle">Add to dial-in history</h2>
      </div>
      <button class="dialog-close" type="button" data-close-dial-log-dialog aria-label="Close dialog">×</button>
    </div>

    <div class="form-grid dial-log-selection">
      <label class="field">
        <span>Bean</span>
        <select id="logBeanInput" required></select>
      </label>
      <label class="field">
        <span>Recipe</span>
        <select id="logRecipeInput" required></select>
      </label>
    </div>
    <div class="selected-log-context" id="selectedLogContext">Choose a bean and recipe.</div>
    <div class="form-grid">
      <label class="field full">
        <span>Brewed at</span>
        <input id="logBrewedAtInput" type="datetime-local" required>
      </label>
      <label class="metric-input">
        <span>Grind setting *</span><div><input id="logGrindInput" type="number" min="0" max="500" step="0.1" required></div>
      </label>
      <label class="metric-input">
        <span>Time *</span><div><input id="logTimeInput" type="number" min="0.1" max="10000" step="0.1" required><small>sec</small></div>
      </label>
      <label class="metric-input">
        <span>Dose</span><div><input id="logDoseInput" type="number" min="0" max="1000" step="0.1"><small>g</small></div>
      </label>
      <label class="metric-input">
        <span>Yield</span><div><input id="logYieldInput" type="number" min="0" max="10000" step="0.1"><small>g</small></div>
      </label>
      <label class="field">
        <span>Taste</span>
        <select id="logTasteInput">
          <option value="neutral">Not judged / neutral</option>
          <option value="very_bitter">Very bitter</option>
          <option value="bitter">Bitter</option>
          <option value="little_bitter">Little bitter</option>
          <option value="balanced">Balanced</option>
          <option value="little_sour">Little sour</option>
          <option value="sour">Sour</option>
          <option value="very_sour">Very sour</option>
        </select>
      </label>
      <div class="fill-rating-field">
        <span>Shot rating</span>
        <div class="fill-rating" id="logRatingControl" role="group" aria-label="Shot rating">
          <button class="fill-rating-button" type="button" data-rating-value="1" aria-label="1 star"><span class="app-icon" style="--app-icon:url('/static/icons/ui/star.svg')" aria-hidden="true"></span></button>
          <button class="fill-rating-button" type="button" data-rating-value="2" aria-label="2 stars"><span class="app-icon" style="--app-icon:url('/static/icons/ui/star.svg')" aria-hidden="true"></span></button>
          <button class="fill-rating-button" type="button" data-rating-value="3" aria-label="3 stars"><span class="app-icon" style="--app-icon:url('/static/icons/ui/star.svg')" aria-hidden="true"></span></button>
          <button class="fill-rating-button" type="button" data-rating-value="4" aria-label="4 stars"><span class="app-icon" style="--app-icon:url('/static/icons/ui/star.svg')" aria-hidden="true"></span></button>
          <button class="fill-rating-button" type="button" data-rating-value="5" aria-label="5 stars"><span class="app-icon" style="--app-icon:url('/static/icons/ui/star.svg')" aria-hidden="true"></span></button>
        </div>
        <input id="logRatingInput" type="hidden">
      </div>
      <label class="field full">
        <span>Notes</span>
        <textarea id="logNotesInput" rows="3" maxlength="1000" placeholder="Channeling, puck prep, age of beans, next adjustment …"></textarea>
      </label>
      <label class="favorite-check full valid-check">
        <input id="logValidInput" type="checkbox" checked>
        <span>Use this measurement in grind calculations</span>
      </label>
    </div>

    <div class="dialog-actions">
      <span class="action-spacer"></span>
      <button class="secondary-button" type="button" data-close-dial-log-dialog>Cancel</button>
      <button class="primary-button" id="saveDialInLogButton" type="submit">Save measurement</button>
    </div>
  </form>
</dialog>
