<dialog id="recipeDialog">
<form id="recipeForm">
<div class="dialog-header">
<div>
<p class="eyebrow">Espresso Setup</p>
<h2 id="dialogTitle">New recipe</h2>
</div>
<button aria-label="Close dialog" class="dialog-close" data-close-dialog="" type="button">×</button>
</div>
<section class="import-panel">
<div class="import-panel-heading" id="importHelp">
<span aria-hidden="true" class="import-icon">↗</span>
<div>
<strong>Import coffee details</strong>
<small>For a brand-new recipe, scan the bag or paste the product link. Dialed In will try to find the coffee name, roaster, origin, bean composition, and roast level.</small>
</div>
</div>
<div class="barcode-import-row" id="barcodeImportRow">
<label class="field barcode-input-field">
<span>Barcode</span>
<input aria-describedby="barcodeStatus" autocomplete="off" id="barcodeInput" inputmode="numeric" maxlength="18" placeholder="EAN / UPC" type="text"/>
</label>
<button class="secondary-button barcode-scan-button" id="barcodeScanButton" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24">
<path d="M8.5 5 10 3h4l1.5 2H19a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h3.5Zm3.5 3.25A4.75 4.75 0 1 0 12 17.75a4.75 4.75 0 0 0 0-9.5Zm0 2A2.75 2.75 0 1 1 12 15.75a2.75 2.75 0 0 1 0-5.5Z"></path>
</svg>
            Scan barcode
          </button>
<button class="secondary-button barcode-lookup-button" id="barcodeLookupButton" type="button">
            Look up
          </button>
</div>
<p aria-live="polite" class="scrape-status" id="barcodeStatus" role="status"></p>
<div aria-hidden="true" class="import-divider"><span>or use a product link</span></div>
<div class="url-import-row">
<label class="field import-url-field">
<span>Reorder link</span>
<input autocomplete="url" id="orderUrlInput" inputmode="url" name="orderUrl" placeholder="https://roastery.example/coffee" type="url"/>
</label>
<button class="secondary-button scrape-button" id="scrapeButton" type="button">Fetch details</button>
</div>
<p aria-live="polite" class="scrape-status" id="scrapeStatus" role="status"></p>
</section>
<div class="form-grid">
<label class="field full">
<span>Coffee / bean *</span>
<input id="nameInput" maxlength="60" name="name" placeholder="e.g. Espresso No. 3" required=""/>
</label>
<label class="field">
<span>Roaster</span>
<input id="roasterInput" maxlength="60" name="roaster" placeholder="Roastery name"/>
</label>
<label class="field">
<span>Origin country</span>
<input autocomplete="off" id="originCountryInput" list="originCountryOptions" maxlength="50" name="originCountry" placeholder="Select or type any country"/>
<datalist id="originCountryOptions">
<option value="Brazil"></option>
<option value="Burundi"></option>
<option value="Colombia"></option>
<option value="Costa Rica"></option>
<option value="Cuba"></option>
<option value="Dominican Republic"></option>
<option value="Ecuador"></option>
<option value="El Salvador"></option>
<option value="Ethiopia"></option>
<option value="Guatemala"></option>
<option value="Haiti"></option>
<option value="Honduras"></option>
<option value="India"></option>
<option value="Indonesia"></option>
<option value="Jamaica"></option>
<option value="Kenya"></option>
<option value="Laos"></option>
<option value="Mexico"></option>
<option value="Myanmar"></option>
<option value="Nicaragua"></option>
<option value="Panama"></option>
<option value="Papua New Guinea"></option>
<option value="Peru"></option>
<option value="Philippines"></option>
<option value="Rwanda"></option>
<option value="Tanzania"></option>
<option value="Thailand"></option>
<option value="Timor-Leste"></option>
<option value="Uganda"></option>
<option value="Vietnam"></option>
<option value="Yemen"></option>
<option value="Multiple origins"></option>
</datalist>
</label>
<label class="field">
<span>Region</span>
<input autocomplete="off" id="originRegionInput" list="originRegionOptions" maxlength="60" name="originRegion" placeholder="Select or type any region"/>
<datalist id="originRegionOptions"></datalist>
</label>
<label class="field">
<span>Bean composition</span>
<select id="blendInput" name="blend">
<option value="">Not specified</option>
<option value="100% Arabica">100% Arabica</option>
<option value="90% Arabica / 10% Robusta">90% Arabica / 10% Robusta</option>
<option value="80% Arabica / 20% Robusta">80% Arabica / 20% Robusta</option>
<option value="70% Arabica / 30% Robusta">70% Arabica / 30% Robusta</option>
<option value="60% Arabica / 40% Robusta">60% Arabica / 40% Robusta</option>
<option value="50% Arabica / 50% Robusta">50% Arabica / 50% Robusta</option>
<option value="30% Arabica / 70% Robusta">30% Arabica / 70% Robusta</option>
<option value="100% Robusta">100% Robusta</option>
<option value="Arabica / Robusta blend">Arabica / Robusta blend (ratio unknown)</option>
<option value="custom">Custom ratio</option>
</select>
</label>
<div class="custom-blend-fields full hidden" id="customBlendFields">
<label class="metric-input compact-metric">
<span>Arabica</span>
<div><input id="arabicaInput" max="100" min="0" step="1" type="number" value="50"/><small>%</small></div>
</label>
<div aria-hidden="true" class="blend-visual">
<div class="blend-bar"><span id="arabicaBar"></span></div>
<small id="blendSum">50% Arabica · 50% Robusta</small>
</div>
<label class="metric-input compact-metric">
<span>Robusta</span>
<div><input id="robustaInput" max="100" min="0" step="1" type="number" value="50"/><small>%</small></div>
</label>
</div>
<label class="field">
<span>Roast level</span>
<select id="roastInput" name="roast">
<option value="light">Light</option>
<option selected="" value="medium">Medium</option>
<option value="dark">Dark</option>
</select>
</label>
<label class="field">
<span>Status</span>
<select id="statusInput" name="status">
<option value="active">Active</option>
<option value="empty">Out of beans</option>
<option value="wishlist">Wishlist</option>
</select>
</label>
</div>
<div class="form-section">
<div class="form-section-title">
<span>Recipe</span>
<small id="ratioPreview">Ratio 1:2.00</small>
</div>
<div class="recipe-fields">
<label class="metric-input">
<span>Dose</span>
<div><input id="doseInput" max="40" min="1" name="dose" required="" step="0.1" type="number" value="18"/><small>g in</small></div>
</label>
<label class="metric-input">
<span>Yield</span>
<div><input id="yieldInput" max="100" min="1" name="yield" required="" step="0.1" type="number" value="36"/><small>g out</small></div>
</label>
<label class="metric-input">
<span>Time</span>
<div><input id="timeInput" max="120" min="1" name="time" required="" step="1" type="number" value="28"/><small>sec.</small></div>
</label>
<label class="metric-input">
<span>Grind setting</span>
<div><input id="grindInput" inputmode="decimal" max="100" min="0" name="grind" placeholder="e.g. 17" step="0.1" type="number"/></div>
</label>
<label class="metric-input">
<span>Temperature</span>
<div><input id="tempInput" max="110" min="70" name="temp" placeholder="93" step="0.5" type="number"/><small>°C</small></div>
</label>
<label class="metric-input">
<span>Rating</span>
<div><input id="ratingInput" max="5" min="0" name="rating" step="0.5" type="number" value="4"/><small>/ 5</small></div>
</label>
</div>
</div>
<div class="form-grid">
<label class="field full">
<span>Notes</span>
<textarea id="notesInput" maxlength="500" name="notes" placeholder="Flavor, observations, next adjustment …" rows="4"></textarea>
</label>
<label class="favorite-check full">
<input id="favoriteInput" name="favorite" type="checkbox"/>
<span>Mark as favorite</span>
</label>
</div>
<div class="dialog-actions">
<button class="danger-button hidden" id="deleteRecipeButton" type="button">Delete</button>
<span class="action-spacer"></span>
<button class="secondary-button" data-close-dialog="" type="button">Cancel</button>
<button class="primary-button" type="submit">Save recipe</button>
</div>
</form>
</dialog>
