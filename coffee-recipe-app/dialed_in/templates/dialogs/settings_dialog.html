<dialog id="settingsDialog">
<form id="settingsForm">
  <div class="dialog-header">
    <div><p class="eyebrow">Your setup</p><h2>Settings</h2></div>
    <button aria-label="Close dialog" class="dialog-close" data-close-settings type="button">×</button>
  </div>
  <div class="form-grid">
    <label class="field full"><span>Espresso machine</span><input id="machineInput" maxlength="80"></label>
    <label class="field full"><span>Grinder</span><input id="grinderSettingsInput" maxlength="80"></label>
  </div>
  <div class="backup-panel">
    <h3>Back up all app data</h3>
    <p>The export now includes beans, method-specific recipes, the complete dial-in history and setup settings. Old recipe-only backups remain importable.</p>
    <div class="backup-actions">
      <button class="secondary-button" id="exportButton" type="button">Export JSON</button>
      <label class="secondary-button file-button">Import JSON<input accept="application/json,.json" id="importInput" type="file"></label>
    </div>
  </div>
  <div class="dialog-actions">
    <button class="secondary-button" data-close-settings type="button">Cancel</button>
    <button class="primary-button" type="submit">Save setup</button>
  </div>
</form>
</dialog>
