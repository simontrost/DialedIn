<dialog class="quick-add-dialog" id="quickAddDialog">
  <div class="quick-add-content">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Create</p>
        <h2>Add something new</h2>
      </div>
      <button class="dialog-close" type="button" data-close-quick-add aria-label="Close dialog">×</button>
    </div>
    <div class="quick-add-grid">
      <button type="button" data-quick-add="bean">
        <span aria-hidden="true">◆</span>
        <strong>New bean</strong>
        <small>Roaster, origin, blend and product details</small>
      </button>
      <button type="button" data-quick-add="recipe">
        <span aria-hidden="true">☕</span>
        <strong>New recipe</strong>
        <small>Choose a bean and brewing method</small>
      </button>
      <button type="button" data-quick-add="measurement">
        <span aria-hidden="true">◎</span>
        <strong>New measurement</strong>
        <small>Add a brew to the persistent dial-in history</small>
      </button>
    </div>
  </div>
</dialog>
