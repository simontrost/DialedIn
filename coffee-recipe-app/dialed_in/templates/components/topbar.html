<header class="topbar">
  <a class="brand" href="#overview" data-page-link="overview" aria-label="Dialed In overview">
    <span class="brand-mark" aria-hidden="true">
      <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="">
    </span>
    <span>
      <strong>Dialed In</strong>
      <small>Coffee Recipe Book</small>
    </span>
  </a>

  <nav class="desktop-nav" aria-label="Main navigation">
    <button class="active" type="button" data-page-link="overview">Overview</button>
    <button type="button" data-page-link="beans">Beans</button>
    <button type="button" data-page-link="recipes">Recipes</button>
    <button type="button" data-page-link="dial-in">Dial In</button>
  </nav>

  <div class="topbar-actions">
    <button class="icon-button origin-map-button" type="button" data-page-link="origins"
      aria-label="Open coffee origin map" title="Coffee origin map">
      <span class="app-icon app-icon--md"
        style="--app-icon:url('{{ url_for('static', filename='icons/navigation/origin-map.svg') }}')"
        aria-hidden="true"></span>
    </button>
    <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings">
      <span class="app-icon app-icon--md"
        style="--app-icon:url('{{ url_for('static', filename='icons/navigation/settings.svg') }}')"
        aria-hidden="true"></span>
    </button>
  </div>
</header>
