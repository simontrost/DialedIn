<section class="app-page hidden" id="page-recipes" data-page="recipes">
  <header class="page-header">
    <div>
      <p class="eyebrow">Recipe book</p>
      <h1>Method-specific recipes</h1>
      <p>Select a bean and store independent recipes for espresso, V60, AeroPress, milk drinks and more.</p>
    </div>
    <button class="primary-button desktop-add" id="recipesAddButton" type="button"><span class="app-icon app-icon--sm" style="--app-icon:url('{{ url_for('static', filename='icons/ui/add.svg') }}')" aria-hidden="true"></span> New recipe</button>
  </header>

  <section class="content-section">
    <div class="toolbar recipe-toolbar">
      <label class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="recipeSearchInput" type="search" placeholder="Search recipe or bean …" autocomplete="off">
      </label>
      <select id="recipeBeanFilter" aria-label="Filter by bean"></select>
      <select id="recipeMethodFilter" aria-label="Filter by brewing method"></select>
      <select id="recipeSortSelect" aria-label="Sort recipes">
        <option value="favorites_recent">Favorites &amp; recently updated</option>
        <option value="created_desc">Date added · newest</option>
        <option value="created_asc">Date added · oldest</option>
        <option value="name_asc">Alphabetical · A–Z</option>
        <option value="name_desc">Alphabetical · Z–A</option>
      </select>
      <label class="favorites-filter">
        <input id="recipeFavoritesFilter" type="checkbox">
        <span>Favorites only</span>
      </label>
    </div>

    <div class="brew-recipe-grid" id="brewRecipeGrid"></div>
    <div class="empty-state hidden" id="recipeEmptyState">
      <div class="empty-cup" aria-hidden="true"><span class="app-icon" style="--app-icon:url('{{ url_for('static', filename='icons/navigation/recipes.svg') }}')" aria-hidden="true"></span></div>
      <h3>No matching recipes</h3>
      <p>Create a method-specific recipe or adjust the filters.</p>
      <button class="primary-button" id="recipeEmptyAddButton" type="button">Create recipe</button>
    </div>
  </section>
</section>
